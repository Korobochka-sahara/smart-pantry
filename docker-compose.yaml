services:
  postgres:
    image: postgres:16
    container_name: smart-pantry-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: smart_pantry
      POSTGRES_USER: smart_pantry
      POSTGRES_PASSWORD: smart_pantry_password

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: